# =====================================================
# APPLICATION IDENTITY
# =====================================================
spring.application.name=rules-engine-service
server.port=8082
spring.main.keep-alive=true

# =====================================================
# KAFKA
# =====================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=rules-engine-group
spring.kafka.consumer.auto-offset-reset=earliest

# =====================================================
# REDIS
# =====================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# =====================================================
# KAFKA TOPICS
# =====================================================
sentinel.kafka.topics.transactions-raw=transactions.raw
sentinel.kafka.topics.fraud-scored=fraud.scored

# =====================================================
# VELOCITY RULE
# =====================================================
sentinel.rules.velocity.max-transactions=5
sentinel.rules.velocity.window-seconds=60
sentinel.rules.velocity.score-contribution=35

# =====================================================
# AMOUNT THRESHOLD RULE
# =====================================================
sentinel.rules.amount.score-contribution=25

# =====================================================
# OFF HOURS RULE
# =====================================================
sentinel.rules.off-hours.score-contribution=15

# =====================================================
# NEW DEVICE RULE
# =====================================================
sentinel.rules.device.score-contribution=20

# =====================================================
# MERCHANT CATEGORY RULE
# =====================================================
sentinel.rules.merchant.score-contribution-critical=40
sentinel.rules.merchant.score-contribution-high=25
sentinel.rules.merchant.score-contribution-medium=15

# =====================================================
# GEOGRAPHIC ANOMALY RULE
# =====================================================
sentinel.rules.geo.database-path=classpath:GeoLite2-City.mmdb
sentinel.rules.geo.max-travel-speed-kmh=800
sentinel.rules.geo.score-contribution=45

# =====================================================
# BEHAVIORAL BASELINE RULE
# =====================================================
sentinel.rules.baseline.deviation-multiplier=5
sentinel.rules.baseline.min-transactions=3
sentinel.rules.baseline.score-contribution=30

# =====================================================
# RECIPIENT RISK RULE
# =====================================================
sentinel.rules.recipient.medium-threshold=1
sentinel.rules.recipient.high-threshold=3
sentinel.rules.recipient.critical-threshold=6
sentinel.rules.recipient.score-medium=20
sentinel.rules.recipient.score-high=35
sentinel.rules.recipient.score-critical=50

# =====================================================
# ACTUATOR
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always