# ================================================================
# HorizontalPodAutoscaler — scoring-service
#
# Why scoring-service specifically?
# Each Groq AI call takes 200-400ms and blocks a thread.
# Under high transaction volume, the scoring-service queue
# backs up. HPA detects rising CPU and adds pods.
#
# How it works:
# Kubernetes metrics-server monitors CPU every 15 seconds.
# If average CPU across all scoring-service pods > 70%:
#   → Scale up (add a pod), up to maxReplicas: 3
# If CPU drops back below 70%:
#   → Scale down (remove a pod), minimum minReplicas: 1
#
# stabilizationWindowSeconds: 60
#   Don't scale down within 60 seconds of scaling up.
#   Prevents thrashing (rapid scale up/down cycles).
#
# In production: maxReplicas would be higher, and you'd
# also add a custom metric (Kafka consumer lag) so the
# HPA responds to queue depth, not just CPU.
# ================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scoring-service-hpa
  namespace: sentinel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scoring-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30