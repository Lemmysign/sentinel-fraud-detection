# ================================================================
# API Gateway — Deployment + Service
#
# The single entry point for all external traffic.
# Routes /api/v1/transactions → ingestion-service
# Routes /api/v1/cases        → case-management-service
#
# Uses Spring Cloud Gateway (WebFlux/Netty — reactive).
# Memory limit 512Mi — gateway does routing only, no heavy logic.
# ================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sentinel
  labels:
    app: api-gateway
    component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        component: gateway
    spec:
      containers:
        - name: api-gateway
          image: lemmy007/sentinel-api-gateway:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            # Spring Cloud Gateway routing — points at K8s service DNS names
            # Inside the cluster, services are reachable by their Service name
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_ID
              value: "ingestion-service"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_URI
              value: "http://ingestion-service:8081"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0
              value: "Path=/api/v1/transactions/**"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_1_ID
              value: "case-management-service"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_1_URI
              value: "http://case-management-service:8084"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0
              value: "Path=/api/v1/cases/**"
            - name: SPRING_APPLICATION_NAME
              value: "api-gateway"
            - name: SERVER_PORT
              value: "8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Liveness: if this fails 3 times, Kubernetes restarts the pod
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          # Readiness: pod only receives traffic when this passes
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
# ================================================================
# Service — gives the Deployment a stable cluster-internal address
# ClusterIP = only reachable inside the cluster (other pods)
# The Ingress controller routes external traffic to this Service
# ================================================================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: sentinel
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP