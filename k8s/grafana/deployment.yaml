# ================================================================
# Grafana — Deployment + Service
#
# Mounts the datasource ConfigMap into Grafana's provisioning
# directory — Grafana scans /etc/grafana/provisioning/datasources/
# on startup and auto-configures anything it finds there.
#
# Default admin credentials: admin / admin (you'll be prompted
# to change on first login — fine for local/portfolio use).
#
# type: NodePort — unlike our other services (ClusterIP, internal
# only), Grafana needs to be reachable from your browser. NodePort
# exposes it on the Minikube VM's IP on a fixed port.
# ================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sentinel
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: sentinel
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030