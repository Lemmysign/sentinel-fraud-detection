# ================================================================
# Ingestion Service — Deployment + Service
#
# Receives transactions via REST, validates, publishes to Kafka.
# Memory 768Mi — Spring Web + Kafka producer + validation.
# ================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: sentinel
  labels:
    app: ingestion-service
    component: ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
        component: ingestion
    spec:
      containers:
        - name: ingestion-service
          image: lemmy007/sentinel-ingestion-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_APPLICATION_NAME
              value: "ingestion-service"
            - name: SERVER_PORT
              value: "8081"
            # Kafka — from ConfigMap
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: SENTINEL_KAFKA_TOPICS_TRANSACTIONS_RAW
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: TOPIC_TRANSACTIONS_RAW
          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: sentinel
  labels:
    app: ingestion-service
spec:
  type: ClusterIP
  selector:
    app: ingestion-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP