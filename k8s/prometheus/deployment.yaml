# ================================================================
# Prometheus — Deployment + Service
#
# Runs the Prometheus server itself. Mounts the ConfigMap from
# above as a file at /etc/prometheus/prometheus.yml — this is
# the standard Prometheus config file location.
#
# No persistent storage configured — metrics history is lost
# on pod restart. Acceptable for a portfolio project; production
# would add a PersistentVolumeClaim.
# ================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sentinel
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus/
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sentinel
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090