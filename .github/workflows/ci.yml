name: Sentinel CI — Build and Push Docker Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: lemmy007

jobs:
  build-and-push:
    name: Build, Test, and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all services
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api-gateway/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/sentinel-api-gateway:latest
            ${{ env.IMAGE_PREFIX }}/sentinel-api-gateway:${{ steps.tag.outputs.SHA }}

      - name: Build and push ingestion-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ingestion-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/sentinel-ingestion-service:latest
            ${{ env.IMAGE_PREFIX }}/sentinel-ingestion-service:${{ steps.tag.outputs.SHA }}

      - name: Build and push rules-engine-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: rules-engine-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/sentinel-rules-engine-service:latest
            ${{ env.IMAGE_PREFIX }}/sentinel-rules-engine-service:${{ steps.tag.outputs.SHA }}

      - name: Build and push scoring-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: scoring-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/sentinel-scoring-service:latest
            ${{ env.IMAGE_PREFIX }}/sentinel-scoring-service:${{ steps.tag.outputs.SHA }}

      - name: Build and push case-management-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: case-management-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/sentinel-case-management-service:latest
            ${{ env.IMAGE_PREFIX }}/sentinel-case-management-service:${{ steps.tag.outputs.SHA }}

      - name: Build and push feedback-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: feedback-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/sentinel-feedback-service:latest
            ${{ env.IMAGE_PREFIX }}/sentinel-feedback-service:${{ steps.tag.outputs.SHA }}

      - name: Summary
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ steps.tag.outputs.SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "**Images pushed:**" >> $GITHUB_STEP_SUMMARY
          echo "- lemmy007/sentinel-api-gateway:${{ steps.tag.outputs.SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- lemmy007/sentinel-ingestion-service:${{ steps.tag.outputs.SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- lemmy007/sentinel-rules-engine-service:${{ steps.tag.outputs.SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- lemmy007/sentinel-scoring-service:${{ steps.tag.outputs.SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- lemmy007/sentinel-case-management-service:${{ steps.tag.outputs.SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- lemmy007/sentinel-feedback-service:${{ steps.tag.outputs.SHA }}" >> $GITHUB_STEP_SUMMARY