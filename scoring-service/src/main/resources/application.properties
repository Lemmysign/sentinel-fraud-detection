# =====================================================
# APPLICATION IDENTITY
# =====================================================
spring.application.name=scoring-service

# =====================================================
# SERVER PORT
# =====================================================
server.port=8083

# =====================================================
# KAFKA CONFIGURATION
# =====================================================
spring.kafka.bootstrap-servers=localhost:9092

# CONSUMER CONFIG
spring.kafka.consumer.group-id=scoring-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sentinel.*
spring.kafka.consumer.auto-offset-reset=earliest

# PRODUCER CONFIG
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# =====================================================
# SPRING AI ? OLLAMA
# Points to Ollama running locally.
# Ollama runs on port 11434 by default.
# llama3.2 is the model we use for fraud analysis ?
# it is small enough to run on a laptop but powerful
# enough for structured reasoning tasks.
# =====================================================
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2

# =====================================================
# ACTUATOR
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


spring.main.web-application-type=none
spring.main.keep-alive=true