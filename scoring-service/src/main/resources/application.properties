# =====================================================
# APPLICATION IDENTITY
# =====================================================
spring.application.name=scoring-service

# =====================================================
# SERVER PORT
# =====================================================
server.port=8083

# =====================================================
# WEB APPLICATION TYPE
# Scoring service is a background Kafka processor.
# No web server needed.
# =====================================================
spring.main.web-application-type=none
spring.main.keep-alive=true

# =====================================================
# KAFKA CONFIGURATION
# =====================================================
spring.kafka.bootstrap-servers=localhost:9092

# CONSUMER CONFIG
spring.kafka.consumer.group-id=scoring-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sentinel.*
spring.kafka.consumer.auto-offset-reset=earliest

# PRODUCER CONFIG
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# =====================================================
# GROQ AI (via OpenAI-compatible API)
# Groq runs Llama3.3 70B in the cloud ? no local
# installation needed. API key injected from
# environment variable.
# =====================================================
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# =====================================================
# KAFKA TOPICS
# =====================================================
sentinel.kafka.topics.fraud-scored=fraud.scored
sentinel.kafka.topics.fraud-alerts=fraud.alerts

# =====================================================
# ACTUATOR
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always