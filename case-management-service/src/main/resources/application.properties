# =====================================================
# APPLICATION IDENTITY
# =====================================================
spring.application.name=case-management-service

# =====================================================
# SERVER PORT
# =====================================================
server.port=8084

# =====================================================
# POSTGRESQL DATABASE
# Points to PostgreSQL running in Docker Compose.
# Database name: sentinel_cases
# Username and password match what we will define
# in docker-compose.yml.
# =====================================================

spring.datasource.url=jdbc:postgresql://localhost:5433/sentinel_cases
spring.datasource.username=sentinel
spring.datasource.password=sentinel123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE CONFIG
# ddl-auto=update means Hibernate automatically creates
# or updates database tables based on your Java entity
# classes. Good for development ? in production you
# would use "validate" and manage schema with Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# KAFKA CONFIGURATION
# =====================================================
spring.kafka.bootstrap-servers=localhost:9092

# CONSUMER CONFIG
spring.kafka.consumer.group-id=case-management-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sentinel.*
spring.kafka.consumer.auto-offset-reset=earliest

# PRODUCER CONFIG
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# =====================================================
# ACTUATOR
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================================================
# SWAGGER / OPENAPI
# =====================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html