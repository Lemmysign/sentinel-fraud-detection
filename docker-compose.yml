# =====================================================
# SENTINEL FRAUD DETECTION — LOCAL INFRASTRUCTURE
# =====================================================
# This file starts all infrastructure dependencies
# that Sentinel's microservices connect to.
#
# Usage:
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Logs:    docker compose logs -f
#   Status:  docker compose ps
#
# All services run on a shared network called
# sentinel-network so they can find each other
# by container name (e.g. kafka:29092)
# =====================================================

services:

  # ===================================================
  # ZOOKEEPER
  # ===================================================
  # Kafka's coordination service. Manages the Kafka
  # broker, tracks which consumers are connected, and
  # handles leader election for Kafka partitions.
  #
  # Think of it as Kafka's manager — Kafka reports to
  # Zookeeper and cannot run without it.
  #
  # Note: Newer Kafka versions (3.x+) can run without
  # Zookeeper using KRaft mode, but we use the classic
  # setup here as it is more widely documented and
  # easier to understand when learning.
  # ===================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: sentinel-zookeeper
    ports:
      - "2181:2181"
    environment:
      # The port Zookeeper listens on for client
      # connections from Kafka
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================
  # KAFKA
  # ===================================================
  # The message broker at the heart of Sentinel.
  # All 6 microservices communicate through Kafka
  # topics instead of calling each other directly.
  #
  # Two listener addresses are configured:
  #
  # PLAINTEXT://kafka:29092
  #   Used by other Docker containers to reach Kafka.
  #   When your Spring Boot services run inside Docker
  #   they use this address.
  #
  # PLAINTEXT_HOST://localhost:9092
  #   Used by services running on your host machine
  #   (outside Docker). When you run Spring Boot from
  #   IntelliJ, it uses localhost:9092 — which is why
  #   we set bootstrap-servers=localhost:9092 in all
  #   application.properties files.
  # ===================================================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: sentinel-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # Auto create topics when a producer or consumer
      # references them for the first time
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ===================================================
  # KAFKA UI
  # ===================================================
  # A web dashboard for viewing Kafka topics,
  # messages, and consumer groups.
  #
  # Access at: http://localhost:8090
  #
  # This is extremely useful for debugging — you can
  # watch messages flowing through your topics in
  # real time as transactions are processed.
  # You can see exactly what each service published
  # and consumed without writing any extra code.
  # ===================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sentinel-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sentinel-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - sentinel-network

  # ===================================================
  # POSTGRESQL
  # ===================================================
  # Relational database used by case-management-service
  # to store fraud cases, analyst decisions, and
  # audit logs.
  #
  # Why PostgreSQL and not MySQL?
  # PostgreSQL has better support for JSON columns
  # which we use to store flexible transaction metadata
  # on fraud cases. It also has better concurrency
  # handling for the kind of read/write patterns
  # fraud case management requires.
  #
  # Credentials match what is configured in
  # case-management-service application.properties:
  #   spring.datasource.username=sentinel
  #   spring.datasource.password=sentinel123
  #   spring.datasource.url=...sentinel_cases
  # ===================================================
  postgresql:
    image: postgres:15-alpine
    container_name: sentinel-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sentinel_cases
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password1a@
    volumes:
      # Named volume persists data between restarts.
      # Without this, all your data is lost every time
      # you run docker compose down.
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_cases"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================
  # REDIS
  # ===================================================
  # In-memory data store used by rules-engine-service
  # for velocity checks.
  #
  # Velocity check example:
  #   "Has this account ID made more than 5 transactions
  #    in the last 60 seconds?"
  #
  # Redis is perfect for this because:
  # 1. It stores data in memory — extremely fast
  # 2. It supports TTL (time-to-live) on keys — a
  #    counter automatically expires after 60 seconds
  #    without any cleanup code needed
  # 3. It supports atomic increment operations —
  #    thread-safe counting across multiple service
  #    instances
  #
  # A PostgreSQL query would be far too slow for this
  # check — it needs to complete in under 5ms.
  # Redis responds in under 1ms.
  # ===================================================
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      # Persists Redis data between restarts
      - redis-data:/data
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================
  # MONGODB
  # ===================================================
  # Document database used to store the full raw
  # transaction history.
  #
  # Why MongoDB for transactions and PostgreSQL for
  # cases? They solve different problems:
  #
  # MongoDB (transactions):
  #   Transactions come in many shapes — card payments,
  #   bank transfers, mobile money, lending repayments.
  #   Each has different fields. MongoDB's flexible
  #   document model handles this without needing
  #   schema changes every time a new transaction
  #   type is added.
  #
  # PostgreSQL (cases):
  #   Fraud cases have a fixed, predictable structure —
  #   case ID, status, analyst, resolution. Relational
  #   data with foreign keys and structured queries.
  #   PostgreSQL is the right tool here.
  #
  # This is called polyglot persistence — using the
  # right database for each specific job rather than
  # forcing one database to do everything.
  # ===================================================
  mongodb:
    image: mongo:7
    container_name: sentinel-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: sentinel
      MONGO_INITDB_ROOT_PASSWORD: sentinel123
      MONGO_INITDB_DATABASE: sentinel_transactions
    volumes:
      - mongo-data:/data/db
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

# =====================================================
# VOLUMES
# =====================================================
# Named volumes persist data between docker compose
# down and docker compose up cycles.
# Without these, all database data is lost every time
# you restart the containers.
# =====================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  mongo-data:
    driver: local

# =====================================================
# NETWORKS
# =====================================================
# All containers share this network so they can
# reach each other by container name.
# For example, Kafka reaches Zookeeper at:
#   zookeeper:2181
# instead of needing an IP address.
# =====================================================
networks:
  sentinel-network:
    driver: bridge